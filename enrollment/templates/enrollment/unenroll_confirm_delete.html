<div class="modal fade" id="unenrollModal" tabindex="-1" aria-labelledby="unenrollModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="unenrollModalLabel">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-exclamation-triangle-fill me-2" viewBox="0 0 16 16">
            <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
          </svg>
          Confirm Unenroll
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <p>You are about to unenroll:</p>
        <p class="fw-bold fs-5 mb-1" id="modalStudentName"></p>
        <p class="text-muted mb-3">LRN: <span id="modalStudentLrn"></span></p>

        <div class="alert alert-danger d-flex align-items-start gap-2 mb-0" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-trash3-fill flex-shrink-0 mt-1" viewBox="0 0 16 16">
            <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
          </svg>
          <div>
            <strong>This action cannot be undone.</strong> All data related to this student in this section — including grades, attendance, and other records — will be <strong>permanently deleted</strong>.
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <a id="confirmUnenrollBtn" href="#" class="btn btn-danger">
          Yes, Unenroll Student
        </a>
      </div>

    </div>
  </div>
</div>

<!-- Modal JS: populate dynamic student data before showing -->
<script>
  const unenrollModal = document.getElementById('unenrollModal');
  unenrollModal.addEventListener('show.bs.modal', function (event) {
    const button = event.relatedTarget;
    const studentName = button.getAttribute('data-student-name');
    const studentLrn  = button.getAttribute('data-student-lrn');
    const unenrollUrl = button.getAttribute('data-unenroll-url');

    document.getElementById('modalStudentName').textContent = studentName;
    document.getElementById('modalStudentLrn').textContent  = studentLrn;
    document.getElementById('confirmUnenrollBtn').setAttribute('href', unenrollUrl);
  });
</script>
