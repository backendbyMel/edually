{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>EduAlly {% if title %}- {{ title }}{% endif %}</title>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="{% static 'users/main.css' %}">
        <script src="{% static 'admin/js/vendor/jquery/jquery.js' %}"></script>
        {{ form.media }}
        <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    </head>
    <body>
        <div class="d-flex" id="wrapper">
            {% include 'partials/_sidebar.html' %}
            <div id="page-content-wrapper" class="flex-grow-1 overflow-auto">
                <div id="messages" class="p-3">
                    {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" >
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                    {% endif %}
                </div>
                <div class="container-fluid p-3">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function() {
            var dateInputs = document.querySelectorAll("input[name='date_of_birth']");
            dateInputs.forEach(function(input) {
                flatpickr(input, {
                dateFormat: "Y-m-d",
                clickOpens: true,
                disableMobile: true,
                });
            });
            });
        </script>
        
        <script src="{% static 'js/sidebar.js' %}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        crossorigin="anonymous">
        </script>
        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    </body>
</html>
