{% extends 'users/base.html' %}

{% block content %}
<div class="container mt-5" style="max-width:480px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="fw-bold mb-1">Change email address</h4>
            <p class="text-muted mb-4" style="font-size:0.88rem;">
                Enter the new email address for your account.
            </p>

            <form method="POST">
                {% csrf_token %}

                {{ form.non_field_errors }}

                <div class="mb-3">
                    <label class="form-label" for="{{ form.email.id_for_label }}">
                        Email address
                    </label>
                    <input type="email"
                           name="email"
                           id="{{ form.email.id_for_label }}"
                           value="{{ form.email.value|default:'' }}"
                           class="form-control"
                           required>
                    {{ form.email.errors }}
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    Update email
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
