{% extends "users/base.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row align-items-center min-vh-75">
        <div class="col-md-6">
            <img src="/media/logo_png/logo.png"
                 alt="EduAlly Logo"
                 class="mb-4"
                 style="height: 80px; width: auto;">

            <h1 class="display-5 fw-bold">Welcome to EduAlly</h1>
            <p class="lead text-muted">
                Your learning support platform for students, parents, and educators.
            </p>

            {% if not user.is_authenticated %}
                <div class="d-flex gap-2 mt-4">
                    <a href="{% url 'register' %}" class="btn btn-primary btn-lg">
                        Register
                    </a>
                    <a href="{% url 'login' %}" class="btn btn-outline-primary btn-lg">
                        Login
                    </a>
                </div>
            {% else %}
                <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg mt-4">
                    Go to Dashboard
                </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
