{% extends 'users/base.html' %}
{% block content %}

<h4>Edit Attendance</h4>
<small>
    {{ attendance.enrollment.student.last_name }},
    {{ attendance.enrollment.student.first_name }} — 
    {{ attendance.date }}
</small>

<form method="POST" class="mt-3">
    {% csrf_token %}
    
    <div class="mb-3 w-25">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            <option value="P" 
                {% if attendance.status == 'P' %}selected{% endif %}>
                Present
            </option>
            <option value="A"
                {% if attendance.status == 'A' %}selected{% endif %}>
                Absent
            </option>
            <option value="L"
                {% if attendance.status == 'L' %}selected{% endif %}>
                Late
            </option>
            <option value="E"
                {% if attendance.status == 'E' %}selected{% endif %}>
                Excused
            </option>
        </select>
    </div>

    <div class="mb-3 w-50">
        <label class="form-label">Remarks</label>
        <input type="text"
               name="remarks"
               class="form-control"
               value="{{ attendance.remarks|default:'' }}">
    </div>

    <button type="submit" class="btn btn-warning">
        Update
    </button>
    <a href="{% url 'attendance-student-detail' section.pk attendance.enrollment.pk %}"
       class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock %}
